name: 🚀 Deploy FastAPI (api/) to VPS

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "api/requirements.txt"
      - ".github/workflows/deploy-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "api/requirements.txt"
  workflow_dispatch:

concurrency:
  group: fastapi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 🏗️ Deploy API
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            api
          lfs: false

      - name: 🧭 Debug workspace
        run: |
          pwd
          ls -la
          ls -la api || true
          test -f api/requirements.txt && echo "requirements.txt exists" || echo "requirements.txt missing"

      - name: 🧱 Ensure target structure (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET_DIR="/var/www/api.devleadhunter.dibodev.fr/html"
            sudo mkdir -p "$TARGET_DIR"
            sudo rm -rf "$TARGET_DIR/api"
            sudo mkdir -p "$TARGET_DIR/api"
            sudo mkdir -p "$TARGET_DIR/.venv"
            sudo chown -R $USER:$USER "$TARGET_DIR"

      - name: 📤 Upload API sources (SCP)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          strip_components: 0
          source: "api"
          target: /var/www/api.devleadhunter.dibodev.fr/html

      - name: 🐍 Create/Update venv & install deps (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET_DIR="/var/www/api.devleadhunter.dibodev.fr/html"
            cd "$TARGET_DIR"
            sudo apt-get update -y --allow-releaseinfo-change || true
            # ffmpeg porte tout le pipeline vidéo (mesure de durée, normalisation,
            # montage) : sans lui l'API rend une erreur trompeuse sur chaque upload.
            sudo apt-get install -y python3-venv ffmpeg
            if [ ! -x ".venv/bin/python" ]; then
              python3 -m venv .venv
            fi
            . .venv/bin/activate
            python -m pip install --upgrade pip wheel
            pip install -r api/requirements.txt --no-cache-dir
            # pip n'installe QUE le binding python de Playwright : sans ces deux lignes,
            # la vidéo de prospection échoue sur "Executable doesn't exist". install-deps
            # (root) pose les libs système, install (utilisateur du service) télécharge
            # Chromium dans ~/.cache/ms-playwright — les deux sont idempotents.
            sudo "$TARGET_DIR/.venv/bin/python" -m playwright install-deps chromium
            python -m playwright install chromium
            deactivate

      # Le service ne lance Chromium qu'au moment de générer une vidéo : sans ce
      # smoke test, une install ratée passe inaperçue jusqu'au premier prospect.
      - name: 🎭 Verify Playwright browser (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET_DIR="/var/www/api.devleadhunter.dibodev.fr/html"
            "$TARGET_DIR/.venv/bin/python" - <<'PY'
            from playwright.sync_api import sync_playwright

            with sync_playwright() as playwright:
                playwright.chromium.launch(headless=True).close()
            print("Playwright chromium OK")
            PY

      - name: ⚙️ Create .env file (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET_DIR="/var/www/api.devleadhunter.dibodev.fr/html"
            cd "$TARGET_DIR/api"
            cat > .env <<EOF
            ENV=production
            DEBUG=false
            # ⚠️ CLÉ DE CHIFFREMENT PERSISTANTE — sans elle, encryption_service.py
            # regénère une clé aléatoire à CHAQUE restart et les comptes email / tokens
            # OAuth chiffrés en base deviennent indéchiffrables. Doit rester STABLE.
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            API_VERSION=v1
            API_PREFIX=/api/v1
            API_BASE_URL=${{ secrets.API_BASE_URL }}
            HOST=127.0.0.1
            PORT=8005
            CORS_ORIGINS=http://localhost:3000,http://localhost:5173,https://demo.dibodev.fr
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            ACCESS_TOKEN_EXPIRE_MINUTES=10080
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            # Qonto (encaissement des ventes) : credentials du "Release my app" du
            # Developer Portal — secrets vides = connexion refusée, jamais de fallback sandbox.
            QONTO_ENVIRONMENT=production
            QONTO_CLIENT_ID=${{ secrets.QONTO_CLIENT_ID }}
            QONTO_CLIENT_SECRET=${{ secrets.QONTO_CLIENT_SECRET }}
            QONTO_REDIRECT_URI=https://api.devleadhunter.dibodev.fr/api/v1/payment-accounts/qonto/callback
            DEMO_HOST_BASE_URL=https://demo.dibodev.fr
            DEMO_SITE_VERIFY_RETRIES=3
            DEMO_SITE_VERIFY_RETRY_DELAY_SECONDS=2
            DEMO_SITE_TTL_DAYS=21
            STORYBLOK_MANAGEMENT_TOKEN=${{ secrets.STORYBLOK_MANAGEMENT_TOKEN }}
            STORYBLOK_REGION=eu
            STORYBLOK_WEBHOOK_SECRET=${{ secrets.STORYBLOK_WEBHOOK_SECRET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            RESEND_WEBHOOK_SECRET=${{ secrets.RESEND_WEBHOOK_SECRET }}
            BRIGHTDATA_API_TOKEN=${{ secrets.BRIGHTDATA_API_TOKEN }}
            BRIGHTDATA_ZONE=mcp_unlocker
            PAGESPEED_API_KEY=${{ secrets.PAGESPEED_API_KEY }}
            GOOGLE_POSTMASTER_REDIRECT_URI=https://api.devleadhunter.dibodev.fr/api/v1/email-health/postmaster/callback
            VERCEL_TOKEN=${{ secrets.VERCEL_TOKEN }}
            VERCEL_DEMO_HOST_PROJECT_ID=${{ secrets.VERCEL_DEMO_HOST_PROJECT_ID }}
            VERCEL_DEPLOY_HOOK_URL=${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
            POSTHOG_API_HOST=${{ secrets.POSTHOG_API_HOST }}
            POSTHOG_PROJECT_ID=${{ secrets.POSTHOG_PROJECT_ID }}
            POSTHOG_PERSONAL_API_KEY=${{ secrets.POSTHOG_PERSONAL_API_KEY }}
            POSTHOG_PROJECT_API_KEY=${{ secrets.NUXT_PUBLIC_POSTHOG_PROJECT_API_KEY }}
            POSTHOG_INGESTION_HOST=${{ secrets.NUXT_PUBLIC_POSTHOG_INGESTION_HOST }}
            # Stockage objet Cloudflare R2 (vidéos, vignettes, pièces jointes support).
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
            R2_BUCKET_DEV=${{ secrets.R2_BUCKET_DEV }}
            R2_BUCKET_PROD=${{ secrets.R2_BUCKET_PROD }}
            # URLs publiques (pas des secrets, comme DEMO_HOST_BASE_URL).
            R2_PUBLIC_BASE_URL_DEV=https://pub-8d8cdfbc7b25482cb36b13826e879fbc.r2.dev
            R2_PUBLIC_BASE_URL_PROD=https://pub-16f42d674fbd407c8f21b3f152645750.r2.dev
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            # Web Push (VAPID) — notifications PWA mobile. VAPID_SUBJECT n'est pas un secret.
            VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY_B64=${{ secrets.VAPID_PRIVATE_KEY_B64 }}
            VAPID_SUBJECT=mailto:contact@dibodev.fr
            EOF

      - name: 🧬 Run database migrations (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET_DIR="/var/www/api.devleadhunter.dibodev.fr/html"
            cd "$TARGET_DIR/api"
            # Idempotent runner: schema_migrations tracks applied migrations and each
            # migration guards its own ALTER (INFORMATION_SCHEMA / checkfirst), so this
            # is safe to run on every deploy and only applies what is missing. This is
            # what actually propagates new columns (init_db.py never ALTERs).
            ../.venv/bin/python migrations/run_migrations.py

      - name: 🗄️ Run database seeders (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET_DIR="/var/www/api.devleadhunter.dibodev.fr/html"
            cd "$TARGET_DIR/api"
            # Seeders are idempotent (existing records are skipped) — runs after
            # migrations so any new column the seed data relies on already exists.
            ../.venv/bin/python init_db.py

      - name: ⚙️ Configure/restart systemd service (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET_DIR="/var/www/api.devleadhunter.dibodev.fr/html"
            SERVICE_NAME="devleadhunter-api.service"
            DEPLOY_USER="${{ secrets.SSH_USERNAME }}"
            sudo bash -c "cat > /etc/systemd/system/${SERVICE_NAME}" <<EOF
            [Unit]
            Description=DevLeadHunter FastAPI (Uvicorn)
            After=network.target
            [Service]
            User=${DEPLOY_USER}
            WorkingDirectory=${TARGET_DIR}/api
            Environment=PYTHONPATH=${TARGET_DIR}/api
            ExecStart=${TARGET_DIR}/.venv/bin/uvicorn main:app --host 127.0.0.1 --port 8005 --workers 1 --proxy-headers
            Restart=always
            RestartSec=5
            KillSignal=SIGINT
            MemoryMax=2G
            MemoryHigh=1.5G
            [Install]
            WantedBy=multi-user.target
            EOF
            sudo systemctl daemon-reload
            sudo systemctl enable ${SERVICE_NAME}
            sudo systemctl restart ${SERVICE_NAME}

      # Sans ce check, un crash au boot (ex. SyntaxError) laisse le service en
      # crashloop et le deploy vert — c'est arrivé 2 jours sans que personne ne le voie.
      - name: 🩺 Health check API (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8005/docs || true)
              if [ "$code" = "200" ]; then
                echo "API up (HTTP $code) after ${attempt} attempt(s)."
                exit 0
              fi
              sleep 5
            done
            echo "API did not come up — service status and last logs:"
            sudo systemctl status devleadhunter-api.service --no-pager -l || true
            sudo journalctl -u devleadhunter-api.service -n 60 --no-pager || true
            exit 1

      - name: 🔄 Test & reload Nginx (SSH)
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            sudo nginx -t
            sudo systemctl reload nginx
